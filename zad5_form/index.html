<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bohdan Shvets - Zadanie 5 (Pełne CV + Formularz)</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Zdjęcie profilowe" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div style="text-align: center; margin: 20px;">
            <button onclick="toggleTheme()" style="padding: 10px 15px; cursor: pointer;">Zmień Motyw</button>
            <button onclick="toggleSection()" style="padding: 10px 15px; cursor: pointer;">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="o-mnie">
            <h2>O mnie</h2>
            <p>Student Informatyki. Ta strona łączy funkcje zmiany motywów, ukrywania sekcji oraz walidacji formularza.</p>
        </section>

        <section id="umiejetnosci">
            <h2>Umiejętności</h2>
            <ul>
                <li>Podstawy JavaScript</li>
                <li>HTML5 i CSS3</li>
                <li>Logika Backendowa (C#)</li>
            </ul>
        </section>

        <section id="kontakt-form">
            <h2>Kontakt</h2>
            <form id="contactForm" novalidate>
                <div style="margin-bottom: 10px;">
                    <label>Imię:</label><br>
                    <input type="text" id="firstName" style="width: 100%; padding: 8px;">
                    <span id="firstNameError" style="color: red; font-size: 12px;"></span>
                </div>

                <div style="margin-bottom: 10px;">
                    <label>Nazwisko:</label><br>
                    <input type="text" id="lastName" style="width: 100%; padding: 8px;">
                    <span id="lastNameError" style="color: red; font-size: 12px;"></span>
                </div>

                <div style="margin-bottom: 10px;">
                    <label>E-mail:</label><br>
                    <input type="email" id="email" style="width: 100%; padding: 8px;">
                    <span id="emailError" style="color: red; font-size: 12px;"></span>
                </div>

                <div style="margin-bottom: 10px;">
                    <label>Wiadomość:</label><br>
                    <textarea id="message" rows="4" style="width: 100%; padding: 8px;"></textarea>
                    <span id="messageError" style="color: red; font-size: 12px;"></span>
                </div>

                <button type="submit" style="width: 100%; padding: 10px; background: #2c3e50; color: white; border: none; cursor: pointer;">Wyślij wiadomość</button>
                <p id="successMsg" style="color: green; display: none; font-weight: bold; text-align: center; margin-top: 10px;">✅ Formularz walidowany pomyślnie!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
