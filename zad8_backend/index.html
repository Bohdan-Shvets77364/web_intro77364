<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bohdan Shvets - Zadanie 8 Backend</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Bohdan Shvets" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="kontakt-info">
            <h2>Kontakt</h2>
            <p><strong>Telegram:</strong> <a href="https://t.me/BohdanShvetss" target="_blank">@BohdanShvetss</a></p>
        </section>

        <section id="umiejetnosci-container">
            <h2>Umiejętności (z JSON)</h2>
            <ul id="lista-umiejetnosci"></ul>
        </section>

        <section id="storage-sekcja">
            <h2>Lokalny Notatnik (LocalStorage)</h2>
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="noteInput" placeholder="Nowa notatka...">
                <button onclick="addNote()">Dodaj</button>
            </div>
            <ul id="notesList"></ul>
        </section>

        <section id="kontakt-form">
            <h2>Napisz do mnie (Backend POST)</h2>
            <form id="contactForm" action="https://formspree.io/f/mqakvjge" method="POST" novalidate>
                <div class="form-group">
                    <label>Imię:</label>
                    <input type="text" name="firstName" id="firstName">
                    <span class="error-msg" id="firstNameError"></span>
                </div>
                <div class="form-group">
                    <label>Nazwisko:</label>
                    <input type="text" name="lastName" id="lastName">
                    <span class="error-msg" id="lastNameError"></span>
                </div>
                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" name="email" id="email">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label>Komentarz:</label>
                    <textarea name="message" id="comment" rows="4"></textarea>
                    <span class="error-msg" id="commentError"></span>
                </div>
                <button type="submit" class="submit-btn">Wyślij na Serwer (POST)</button>
                <p id="successMsg" class="success-text" style="display:none;">✅ Dane wysłane na serwer!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
