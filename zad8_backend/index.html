<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohdan Shvets - Zadanie 8 Backend</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Bohdan Shvets" class="profile-img">
        <h1>BOHDAN SHVETS</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="kontakt-info">
            <h2>KONTAKT</h2>
            <p><strong>Telegram:</strong> <a href="https://t.me/BohdanShvetss" target="_blank">@BohdanShvetss</a></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/Bohdan-Shvets77364" target="_blank">github.com/Bohdan-Shvets77364</a></p>
        </section>

        <section id="umiejetnosci-container">
            <h2>UMIEJĘTNOŚCI </h2>
            <ul id="lista-umiejetnosci"></ul>
            <h3 style="text-align: left; margin-left: 20px;">Projekty:</h3>
            <ol id="lista-projektow"></ol>
        </section>

        <section id="storage-sekcja">
            <h2>MOJE NOTATKI </h2>
            <div class="form-group" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="noteInput" placeholder="Dodaj nową notatkę...">
                <button onclick="addNote()" style="width: auto;">Dodaj</button>
            </div>
            <ul id="notesList"></ul>
        </section>

        <section id="kontakt-form">
            <h2>NAPISZ DO MNIE </h2>
            <form action="https://formspree.io/f/mvzldynq" method="POST">
                <div class="form-group">
                    <label>Imię:</label>
                    <input type="text" name="firstName" required placeholder="np. Bohdan">
                </div>
                <div class="form-group">
                    <label>Nazwisko:</label>
                    <input type="text" name="lastName" required placeholder="np. Shvets">
                </div>
                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label>Komentarz:</label>
                    <textarea name="message" rows="4" required placeholder="Twoja wiadomość..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Wyślij wiadomość </button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
