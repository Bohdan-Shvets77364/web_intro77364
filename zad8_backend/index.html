<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohdan Shvets - Zadanie 8 Backend</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Bohdan Shvets" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="kontakt-info">
            <h2>Kontakt</h2>
            <p><strong>Telegram:</strong> <a href="https://t.me/BohdanShvetss" target="_blank">@BohdanShvetss</a></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/Bohdan-Shvets77364" target="_blank">github.com/Bohdan-Shvets77364</a></p>
        </section>

        <section id="umiejetnosci-container">
            <h2>Umiejętności (z JSON)</h2>
            <ul id="lista-umiejetnosci"></ul>
            <h3>Projekty:</h3>
            <ol id="lista-projektow"></ol>
        </section>

        <section id="storage-sekcja">
            <h2>Moje Notatki (LocalStorage)</h2>
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="noteInput" placeholder="Dodaj nową notatkę...">
                <button onclick="addNote()" style="width: auto; padding: 0 15px;">Dodaj</button>
            </div>
            <ul id="notesList" style="margin-top: 15px; list-style: none; padding: 0;"></ul>
        </section>

        <section id="kontakt-form">
            <h2>Napisz do mnie (Backend POST)</h2>
            <form id="contactForm" action="https://formspree.io/f/mqakvjge" method="POST" novalidate>
                <div class="form-group">
                    <label>Imię:</label>
                    <input type="text" name="firstName" id="firstName" placeholder="np. Bohdan">
                    <span class="error-msg" id="firstNameError" style="color: red; font-size: 12px;"></span>
                </div>
                <div class="form-group">
                    <label>Nazwisko:</label>
                    <input type="text" name="lastName" id="lastName" placeholder="np. Shvets">
                    <span class="error-msg" id="lastNameError" style="color: red; font-size: 12px;"></span>
                </div>
                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" name="email" id="email" placeholder="example@mail.com">
                    <span class="error-msg" id="emailError" style="color: red; font-size: 12px;"></span>
                </div>
                <div class="form-group">
                    <label>Komentarz (min. 5 znaków):</label>
                    <textarea name="message" id="comment" rows="4" placeholder="Twoja wiadomość..."></textarea>
                    <span class="error-msg" id="commentError" style="color: red; font-size: 12px;"></span>
                </div>
                <button type="submit" class="submit-btn">Wyślij wiadomość na serwer</button>
                <p id="successMsg" class="success-text" style="display:none; color: green; font-weight: bold; text-align: center; margin-top: 10px;">
                    ✅ Wiadomość została zapisana na serwerze!
                </p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
