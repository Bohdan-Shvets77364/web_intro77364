<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>CV Bohdan Shvets - Zadanie 6 JSON</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Profil" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div style="text-align: center; margin: 20px;">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="umiejetnosci-container">
            <h2>Umiejętności </h2>
            <ul id="lista-umiejetnosci">
                </ul>
        </section>

        <section id="projekty-container">
            <h2>Projekty </h2>
            <ol id="lista-projektow">
                </ol>
        </section>

        <section id="form-sekcja">
            <h2>Kontakt</h2>
            <form id="contactForm" novalidate>
                <input type="text" id="firstName" placeholder="Imię"><br>
                <span id="firstNameError" style="color:red"></span><br>
                <input type="email" id="email" placeholder="E-mail"><br>
                <span id="emailError" style="color:red"></span><br>
                <button type="submit">Wyślij</button>
                <p id="successMsg" style="color:green; display:none">✅ Wysłano!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
