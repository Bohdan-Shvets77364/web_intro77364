<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bohdan Shvets - Zadanie 6 (JSON + Formularz)</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Zdjęcie profilowe" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="umiejetnosci-container">
            <h2>Umiejętności </h2>
            <ul id="lista-umiejetnosci"></ul>
        </section>

        <section id="projekty-container">
            <h2>Projekty </h2>
            <ol id="lista-projektow"></ol>
        </section>

        <section id="kontakt-form">
            <h2>Kontakt - Napisz do mnie</h2>
            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="firstName">Imię:</label>
                    <input type="text" id="firstName" placeholder="Wpisz imię...">
                    <span class="error-msg" id="firstNameError"></span>
                </div>

                <div class="form-group">
                    <label for="lastName">Nazwisko:</label>
                    <input type="text" id="lastName" placeholder="Wpisz nazwisko...">
                    <span class="error-msg" id="lastNameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="email@przyklad.pl">
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="message">Wiadomość:</label>
                    <textarea id="message" rows="4" placeholder="Twoja wiadomość..."></textarea>
                    <span class="error-msg" id="messageError"></span>
                </div>

                <button type="submit" class="submit-btn">Wyślij wiadomość</button>
                <p id="successMsg" class="success-text">✅ Formularz walidowany pomyślnie!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
