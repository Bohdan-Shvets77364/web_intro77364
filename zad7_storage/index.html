<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bohdan Shvets - Zadanie 7 Final</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Bohdan Shvets" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="kontakt-info">
            <h2>Kontakt</h2>
            <p><strong>Telegram:</strong> <a href="https://t.me/BohdanShvetss" target="_blank">@BohdanShvetss</a></p>
            <p><strong>E-mail:</strong> <a href="mailto:bshvets1@stu.vistula.edu.pl">bshvets1@stu.vistula.edu.pl</a></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/Bohdan-Shvets77364" target="_blank">github.com/Bohdan-Shvets77364</a></p>
        </section>

        
        <section id="umiejetnosci-container">
            <h2>Umiejętności </h2>
            <ul id="lista-umiejetnosci"></ul>
            <h3>Projekty:</h3>
            <ol id="lista-projektow"></ol>
        </section>

        
        <section id="storage-sekcja">
            <h2>Moje Notatki </h2>
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="noteInput" placeholder="Dodaj nową notatkę...">
                <button onclick="addNote()" style="width: auto; padding: 0 15px;">Dodaj</button>
            </div>
            <ul id="notesList" style="margin-top: 15px; list-style: none; padding: 0;"></ul>
        </section>

        
        <section id="kontakt-form">
            <h2>Napisz do mnie</h2>
            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label>Imię i Nazwisko:</label>
                    <input type="text" id="fullName" placeholder="Wpisz imię...">
                    <span class="error-msg" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" id="email" placeholder="example@mail.com">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label>Wiadomość / Komentarz:</label>
                    <textarea id="comment" rows="4" placeholder="Napisz komentarz до мене..."></textarea>
                    <span class="error-msg" id="commentError"></span>
                </div>
                <button type="submit" class="submit-btn">Wyślij wiadomość</button>
                <p id="successMsg" class="success-text">✅ Wiadomość została wysłana!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
