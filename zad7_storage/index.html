<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bohdan Shvets - Zadanie 7 LocalStorage</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Bohdan Shvets" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Umiejętności</button>
        </div>
    </header>

    <main>
        <section id="kontakt-info">
            <h2>Dane kontaktowe</h2>
            <p><strong>E-mail:</strong> <a href="mailto:bshvets1@stu.vistula.edu.pl">bshvets1@stu.vistula.edu.pl</a></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/Bohdan-Shvets77364" target="_blank">github.com/Bohdan-Shvets77364</a></p>
            <p><strong>Telegram:</strong> <a href="https://t.me/your_telegram" target="_blank">@your_telegram</a></p>
            <p><strong>Telefon:</strong> +48 576 661 689</p>
        </section>

        
        <section id="storage-sekcja">
            <h2>Moje Notatki (LocalStorage)</h2>
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="noteInput" placeholder="Dodaj nową notatkę..." style="flex: 1;">
                <button onclick="addNote()" style="width: auto; padding: 0 20px;">Dodaj</button>
            </div>
            <ul id="notesList" style="margin-top: 20px;">
               
            </ul>
        </section>

        <section id="umiejetnosci-container">
            <h2>Umiejętności (z JSON)</h2>
            <ul id="lista-umiejetnosci"></ul>
        </section>

        <section id="projekty-container">
            <h2>Projekty (z JSON)</h2>
            <ol id="lista-projektow"></ol>
        </section>

        <section id="kontakt-form">
            <h2>Napisz do mnie (Walidacja)</h2>
            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label>Imię:</label>
                    <input type="text" id="firstName">
                    <span class="error-msg" id="firstNameError"></span>
                </div>
                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" id="email">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <button type="submit" class="submit-btn">Wyślij</button>
                <p id="successMsg" class="success-text">✅ Formularz wysłany!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
