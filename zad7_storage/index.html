<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bohdan Shvets - Zadanie 7</title>
    <link id="theme-style" rel="stylesheet" href="red.css">
</head>
<body>

    <header>
        <img src="myphoto.jpg" alt="Bohdan Shvets" class="profile-img">
        <h1>Bohdan Shvets</h1>
        <div class="buttons-container">
            <button onclick="toggleTheme()">Zmień Motyw</button>
            <button onclick="toggleSection()">Ukryj/Pokaż Sekcję JSON</button>
        </div>
    </header>

    <main>
        
        <section id="kontakt-info">
            <h2>Kontakt i Social Media</h2>
            <p><strong>E-mail:</strong> <a href="mailto:bshvets1@stu.vistula.edu.pl">bshvets1@stu.vistula.edu.pl</a></p>
            <p><strong>GitHub:</strong> <a href="https://github.com/Bohdan-Shvets77364" target="_blank">github.com/Bohdan-Shvets77364</a></p>
            <p><strong>Telegram:</strong> <a href="https://t.me/BohdanShvetss" target="_blank">@BohdanShvetss</a></p>
            <p><strong>Telefon:</strong> +48 576 661 689</p>
        </section>

        
        <section id="json-data-container">
            <h2>Moje Kompetencje (Dane z JSON)</h2>
            <div id="dynamic-content">
                
            </div>
        </section>

       
        <section id="storage-sekcja">
            <h2>Moje Notatki (LocalStorage)</h2>
            <div class="form-group" style="display: flex; gap: 10px;">
                <input type="text" id="noteInput" placeholder="Dodaj nową notatkę...">
                <button onclick="addNote()" style="width: auto; padding: 0 20px;">Dodaj</button>
            </div>
            <ul id="notesList" style="margin-top: 15px; list-style: none; padding: 0;"></ul>
        </section>

        
        <section id="kontakt-form">
            <h2>Napisz do mnie</h2>
            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label>Imię i Nazwisko:</label>
                    <input type="text" id="fullName">
                    <span class="error-msg" id="nameError"></span>
                </div>
                <div class="form-group">
                    <label>E-mail:</label>
                    <input type="email" id="email">
                    <span class="error-msg" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label>Twój Komentarz:</label>
                    <textarea id="comment" rows="5" placeholder="Napisz coś до мене..."></textarea>
                    <span class="error-msg" id="commentError"></span>
                </div>
                <button type="submit" class="submit-btn">Wyślij wiadomość</button>
                <p id="successMsg" class="success-text">✅ Wiadomość została wysłana!</p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
