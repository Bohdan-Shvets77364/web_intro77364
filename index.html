<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bohdan Shvets - Portfolio Projektów</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --text: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .menu {
            display: grid;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 14px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 16px;
        }


        .btn-1 { background-color: #7f8c8d; } 
        .btn-2 { background-color: #27ae60; } 
        .btn-3 { background-color: #e74c3c; }
        .btn-4 { background-color: #f39c12; } 
        .btn-5 { background-color: #2980b9; } 
        .btn-6 { background-color: #8e44ad; } 

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            filter: brightness(1.1);
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bohdan Shvets</h1>
        <p>Laboratorium: Projektowanie Stron WWW</p>
        
        <div class="menu">
            <a href="./zad1_cv/index.html" class="btn btn-1">Zadanie 1: Czysty HTML</a>
            <a href="./zad2_css/index.html" class="btn btn-2">Zadanie 2: Stylizacja CSS</a>
            <a href="./zad3_motyw/index.html" class="btn btn-3">Zadanie 3: Zmiana Motywów</a>
            <a href="./zad4_js/index.html" class="btn btn-4">Zadanie 4: Interakcja JS</a>
            <a href="./zad5_form/index.html" class="btn btn-5">Zadanie 5: Formularz i Walidacja</a>
            <a href="./zad6_json/index.html" class="btn btn-6">Zadanie 6: JSON & Fetch API</a>
        </div>

        <footer>
            Vistula University &copy; 2025
        </footer>
    </div>
